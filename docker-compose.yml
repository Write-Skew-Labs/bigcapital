  # This is a production version of the Bigcapital docker-compose.yml file.
services:
  traefik:
    image: traefik:v3.6.5
    container_name: traefik
    restart: always
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    ports:
      - "8443:8443"
      - "9443:9443"
      - "9444:9444"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik:/etc/traefik
    environment:
      - CF_DNS_API_TOKEN=${CF_API_TOKEN}
    networks:
      bigcapital_network:
  webapp:
    container_name: bigcapital-webapp
    image: bigcapitalhq/webapp:latest
    restart: on-failure
    networks:
          - bigcapital_network
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.bigcapital.rule=Host(`billing.writeskewlabs.com`)"
      - "traefik.http.routers.bigcapital.entrypoints=websecure"
      - "traefik.http.routers.bigcapital.tls=true"
      - "traefik.http.routers.bigcapital.tls.certresolver=letsencrypt"

      - "traefik.http.services.bigcapital.loadbalancer.server.port=80"

  server:
    container_name: bigcapital-server
    image: bigcapitalhq/server:latest
    volumes:
      - ./le-staging.pem:/etc/ssl/certs/le-staging.pem:ro
    expose:
      - '3000'
    links:
      - mysql
      - mongo
      - redis
    depends_on:
      - mysql
      - mongo
      - redis
    restart: on-failure
    networks:
      - bigcapital_network
    environment:
      # Mail
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_SECURE=${MAIL_SECURE}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}

      # Database
      - DB_HOST=mysql
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_CHARSET=${DB_CHARSET}

      # System database
      - SYSTEM_DB_NAME=${SYSTEM_DB_NAME}

      # Tenants databases
      - TENANT_DB_NAME_PERFIX=${TENANT_DB_NAME_PERFIX}

      # Application
      - JWT_SECRET=${JWT_SECRET}

      # MongoDB
      - MONGODB_DATABASE_URL=mongodb://mongo/bigcapital

      # Application
      - BASE_URL=${BASE_URL}

      # Agendash
      - AGENDASH_AUTH_USER=${AGENDASH_AUTH_USER}
      - AGENDASH_AUTH_PASSWORD=${AGENDASH_AUTH_PASSWORD}

      # Sign-up restrictions
      - SIGNUP_DISABLED=${SIGNUP_DISABLED}
      - SIGNUP_ALLOWED_DOMAINS=${SIGNUP_ALLOWED_DOMAINS}
      - SIGNUP_ALLOWED_EMAILS=${SIGNUP_ALLOWED_EMAILS}

      # Sign-up email confirmation
      - SIGNUP_EMAIL_CONFIRMATION=${SIGNUP_EMAIL_CONFIRMATION}

      # Gotenberg (Pdf generator)
      - GOTENBERG_URL=${GOTENBERG_URL}
      - GOTENBERG_DOCS_URL=${GOTENBERG_DOCS_URL}

      # Exchange Rate
      - EXCHANGE_RATE_SERVICE=${EXCHANGE_RATE_SERVICE}
      - OPEN_EXCHANGE_RATE_APP_ID=${OPEN_EXCHANGE_RATE_APP_ID}

      # Bank Sync
      - BANK_FEED_ENABLED=${BANK_FEED_ENABLED}

      # Plaid
      - PLAID_ENV=${PLAID_ENV}
      - PLAID_CLIENT_ID=${PLAID_CLIENT_ID}
      - PLAID_SECRET=${PLAID_SECRET}
      - PLAID_LINK_WEBHOOK=${PLAID_LINK_WEBHOOK}

      # Lemon Squeez
      - LEMONSQUEEZY_API_KEY=${LEMONSQUEEZY_API_KEY}
      - LEMONSQUEEZY_STORE_ID=${LEMONSQUEEZY_STORE_ID}
      - LEMONSQUEEZY_WEBHOOK_SECRET=${LEMONSQUEEZY_WEBHOOK_SECRET}
      - HOSTED_ON_BIGCAPITAL_CLOUD=${HOSTED_ON_BIGCAPITAL_CLOUD}

      # New Relic matrics tracking.
      - NEW_RELIC_DISTRIBUTED_TRACING_ENABLED=${NEW_RELIC_DISTRIBUTED_TRACING_ENABLED}
      - NEW_RELIC_LOG=${NEW_RELIC_LOG}
      - NEW_RELIC_AI_MONITORING_ENABLED=${NEW_RELIC_AI_MONITORING_ENABLED}
      - NEW_RELIC_CUSTOM_INSIGHTS_EVENTS_MAX_SAMPLES_STORED=${NEW_RELIC_CUSTOM_INSIGHTS_EVENTS_MAX_SAMPLES_STORED}
      - NEW_RELIC_SPAN_EVENTS_MAX_SAMPLES_STORED=${NEW_RELIC_SPAN_EVENTS_MAX_SAMPLES_STORED}
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - NEW_RELIC_APP_NAME=${NEW_RELIC_APP_NAME}

      # S3
      - S3_REGION=${S3_REGION}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_BUCKET=${S3_BUCKET}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE}

      # Stripe
      - STRIPE_PAYMENT_SECRET_KEY=${STRIPE_PAYMENT_SECRET_KEY}
      - STRIPE_PAYMENT_PUBLISHABLE_KEY=${STRIPE_PAYMENT_PUBLISHABLE_KEY}
      - STRIPE_PAYMENT_CLIENT_ID=${STRIPE_PAYMENT_CLIENT_ID}
      - STRIPE_PAYMENT_WEBHOOKS_SECRET=${STRIPE_PAYMENT_WEBHOOKS_SECRET}
      - STRIPE_PAYMENT_REDIRECT_URL=${STRIPE_PAYMENT_REDIRECT_URL}

      # LOCAL_SETUP: Uncomment the following env var to add lets-encrypt ca to trusted node CA
#      - NODE_EXTRA_CA_CERTS=/etc/ssl/certs/le-staging.pem
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.bigcapital-api.rule=Host(`billing.writeskewlabs.com`) && PathPrefix(`/api`)"
      - "traefik.http.routers.bigcapital-api.entrypoints=websecure"
      - "traefik.http.routers.bigcapital-api.tls=true"
      - "traefik.http.routers.bigcapital-api.tls.certresolver=letsencrypt"

      - "traefik.http.services.bigcapital-api.loadbalancer.server.port=3000"

    # LOCAL_SETUP: Uncomment the following block to resolve the subdomains by host gateway
#    extra_hosts:
#      - "s3.writeskewlabs.com:host-gateway"
#      - "console.s3.writeskewlabs.com:host-gateway"

  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    user: "10001:10001"
    volumes:
      - ./rustfs/rustfs_data:/data
      - ./rustfs/rustfs_logs:/logs
    command: /data
    restart: unless-stopped
    networks:
      - bigcapital_network
    environment: #
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: true
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_ACCESS_KEY}
    labels:
      - "traefik.enable=true"

      # -------- S3 API --------
      - "traefik.http.routers.rustfs.rule=Host(`s3.writeskewlabs.com`)"
      - "traefik.http.routers.rustfs.entrypoints=rustfs"
      - "traefik.http.routers.rustfs.tls=true"
      - "traefik.http.routers.rustfs.tls.certresolver=letsencrypt"
      - "traefik.http.routers.rustfs.service=rustfs-api"
      - "traefik.http.services.rustfs-api.loadbalancer.server.port=9000"

      # -------- ADMIN CONSOLE --------
      - "traefik.http.routers.rustfs-console.rule=Host(`console.s3.writeskewlabs.com`)"
      - "traefik.http.routers.rustfs-console.entrypoints=rustfs-console"
      - "traefik.http.routers.rustfs-console.tls=true"
      - "traefik.http.routers.rustfs-console.tls.certresolver=letsencrypt"
      - "traefik.http.routers.rustfs-console.service=rustfs-console"
      - "traefik.http.services.rustfs-console.loadbalancer.server.port=9001"
  database_migration:
    container_name: bigcapital-database-migration
    build:
      context: ./
      dockerfile: docker/migration/Dockerfile
    environment:
      # Database
      - DB_HOST=mysql
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_CHARSET=${DB_CHARSET}
      - SYSTEM_DB_NAME=${SYSTEM_DB_NAME}
      # Tenants databases
      - TENANT_DB_NAME_PERFIX=${TENANT_DB_NAME_PERFIX}
    depends_on:
      - mysql
    networks:
      - bigcapital_network

  mysql:
    container_name: bigcapital-mysql
    restart: on-failure
    build:
      context: ./docker/mariadb
    environment:
      - MYSQL_DATABASE=${SYSTEM_DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    volumes:
      - ./mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - bigcapital_network

  mongo:
    image: mongo:noble
    container_name: bigcapital-mongo
    restart: on-failure
    expose:
      - '27017'
    volumes:
      - ./mongodb_data:/var/lib/mongodb
    networks:
      - bigcapital_network

  redis:
    container_name: bigcapital-redis
    restart: on-failure
    build:
      context: ./docker/redis
    expose:
      - '6379'
    volumes:
      - redis:/data
    networks:
      - bigcapital_network

  gotenberg:
    image: gotenberg/gotenberg:8
    expose:
      - '9000'
    networks:
      - bigcapital_network


  # Volumes
volumes:
  redis:
    name: bigcapital_prod_redis
    driver: local

# Networks
networks:
  bigcapital_network:
    driver: bridge
